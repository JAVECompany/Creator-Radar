x-application: &application
  env_file: ${RADAR_ENV_FILE:-.env.production}
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-tooling: &tooling
  <<: *application
  build:
    context: .
    target: tooling
  image: creator-radar-tooling:local

services:
  migrate:
    <<: *tooling
    restart: "no"
    command: ["pnpm", "db:deploy"]
  web:
    <<: *application
    build:
      context: .
      target: web
    image: creator-radar-web:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RADAR_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    <<: *tooling
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 75s

  admin:
    <<: *tooling
    restart: "no"
    profiles: ["bootstrap"]
    command: ["pnpm", "admin:create"]
    depends_on:
      migrate:
        condition: service_completed_successfully
