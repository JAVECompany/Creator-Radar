services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file: ${RADAR_ENV_FILE:-.env.production}
    volumes:
      - production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 4s
      retries: 20

  migrate:
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file: ${RADAR_ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/radar-backup:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/radar-backup"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  production-postgres:
